[tool.poetry]
name = "codecraftai-this-app"
description = "Code Craft AI - This-App"
version = "0.0.1"
authors = [
    "Myron Walker"
]
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
codecraftai-errors = { git = "https://github.com/automationmojo/codecraftai-errors.git", branch = "main" }
codecraftai-extension = { git = "https://github.com/automationmojo/codecraftai-extension.git", branch = "main" }
codecraftai-xmodules = { git = "https://github.com/automationmojo/codecraftai-xmodules.git", branch = "main" }

[tool.poetry.group.dev.dependencies]

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
